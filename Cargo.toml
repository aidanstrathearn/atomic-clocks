[package]
name = "atomic-clocks"
version.workspace = true
edition.workspace = true

[workspace]
members = ["examples/mts-example", "examples/ramsey-example"]
default-members = [".", "examples/mts-example", "examples/ramsey-example"]
exclude = ["local-examples"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[dependencies]
rand = { version = "0.9.2", default-features = false }
rustfft = "6.4.1"

[dev-dependencies]
rand_chacha = { version = "0.9.0", default-features = false }
criterion = { version = "0.7", features = ["html_reports"] }

[[bench]]
name = "propagation"
harness = false

[[bench]]
name = "bloch_state"
harness = false

[[bench]]
name = "mts_ab"
harness = false

[patch."https://github.com/aidanstrathearn/myplotlib.git"]
myplotlib = { path = "../myplotlib" }
