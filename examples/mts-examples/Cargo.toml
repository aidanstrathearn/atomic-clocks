[package]
name = "mts-examples"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
atomic-clocks = { path = "../.." }
myplotlib = { git = "https://github.com/aidanstrathearn/myplotlib.git" }
rayon = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-rayon = { version = "1.3", features = ["no-bundler"] }
