<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MTS velocity</title>
    <link data-trunk rel="rust" />
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
      }

      canvas {
        width: 100%;
        height: 100%;
        display: block;
      }
    </style>
  </head>
  <body>
    <canvas id="mts-velocity-canvas"></canvas>
    <script type="module">
      window.addEventListener("TrunkApplicationStarted", async () => {
        if (!window.crossOriginIsolated) {
          throw new Error(
            "MTS velocity requires cross-origin isolation for WebAssembly threads",
          );
        }

        const threads = Math.max(1, navigator.hardwareConcurrency ?? 1);
        //const threads = 1;  // this is for easy test that threading is working
        await window.wasmBindings.initThreadPool(threads);
        window.wasmBindings.startApp();
      });
    </script>
  </body>
</html>
